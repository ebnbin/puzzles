<h1><a name="netslide"></a>第 9 章：<a name="i0"></a>Netslide</h1>
<p>
本游戏把 Net（见<a href="net.html#net">第 3 章</a>）的网格生成方式与 Sixteen（见<a href="sixteen.html#sixteen">第 6 章</a>）的移动方式结合了起来：你面前是一个 Net 网格，但你不是通过旋转方块把它们转回原位，而是必须每次移动一整行，把它们滑到正确的位置上。
</p>
<p>
与 Sixteen 中一样，<a name="i1"></a>操作使用鼠标或方向键。参见<a href="sixteen.html#sixteen-controls">第 6.1 节</a>。
</p>
<p>
<a name="i2"></a>可用的游戏参数与 Net（见<a href="net.html#net-params">第 3.2 节</a>）和 Sixteen（见<a href="sixteen.html#sixteen-params">第 6.2 节</a>）中的参数含义类似。
</p>
<p>
Netslide 由 Richard Boulton 贡献给本合集。
</p>
