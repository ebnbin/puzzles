<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <!-- 只有一个 theme-color,值由内联脚本和 useTheme 同步;不要按 media 写成
         一对,那会无视玩家手动选的主题。 -->
    <meta name="theme-color" content="#fafaf9" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Puzzles" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="icon" href="/icon-192.png" sizes="192x192" type="image/png" />
    <!-- iOS 只读这一条且只认 PNG:给 SVG 会退化成拿页面截图当主屏图标。 -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Puzzles</title>
    <meta name="description" content="Think between vibes." />
    <link rel="canonical" href="https://puzzles.ebnbin.dev/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Puzzles" />
    <meta property="og:url" content="https://puzzles.ebnbin.dev/" />
    <meta property="og:title" content="Puzzles" />
    <meta property="og:description" content="Think between vibes." />
    <meta property="og:image" content="https://puzzles.ebnbin.dev/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="The gallery: forty puzzle boards as thumbnails, under the name Puzzles."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- 首帧前解析主题和语言,避免闪白/闪英文。这段逻辑和 useTheme、i18n、
         build-doc.mjs 里的同一段必须联动改。 -->
    <script>
      ;(function () {
        var dark = false
        try {
          dark = localStorage.getItem('puzzles.theme') === 'dark'
        } catch (e) {}
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
        document
          .querySelector('meta[name="theme-color"]')
          .setAttribute('content', dark ? '#101013' : '#fafaf9')
        try {
          var lang = localStorage.getItem('puzzles.lang')
          if (lang !== 'en' && lang !== 'zh')
            lang = /^zh/i.test(navigator.language || '') ? 'zh' : 'en'
          document.documentElement.lang = lang === 'zh' ? 'zh-Hans' : 'en'
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <p style="margin: 2rem; font-family: system-ui, sans-serif; line-height: 1.6">
        <strong>Puzzles</strong> — forty logic puzzles by Simon Tatham, compiled
        to WebAssembly. Playing them needs JavaScript, which this browser has
        turned off. The <a href="/doc/en/index.html">manual</a> does not
        (<a href="/doc/zh/index.html">中文</a>).
      </p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
