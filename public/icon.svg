  <g fill="#8f8fff">
    <rect x="100" y="100" width="56" height="56" rx="12"/>
    <rect x="356" y="228" width="56" height="56" rx="12"/>
    <rect x="228" y="356" width="56" height="56" rx="12"/>
  </g>
  <rect x="222" y="222" width="68" height="68" rx="14" fill="#e6e6e6"/>
</svg>
